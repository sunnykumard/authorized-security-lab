services:
  juice-shop:
    image: bkimminich/juice-shop:v20.3.0
    container_name: authorized-lab-juice-shop
    restart: "no"
    init: true
    expose:
      - "3000"
    networks:
      - isolated_lab
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0

  lab-proxy:
    image: nginx:alpine
    container_name: authorized-lab-proxy
    restart: "no"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - isolated_lab
      - proxy_access
    depends_on:
      - juice-shop
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    mem_limit: 128m
    cpus: 0.5

networks:
  isolated_lab:
    name: authorized-lab-internal
    driver: bridge
    internal: true

  proxy_access:
    name: authorized-lab-proxy-access
    driver: bridge
